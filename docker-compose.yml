services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mobilitypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobilitypulse}
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobilitypulse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mlflow:
    image: python:3.11-slim
    container_name: mobilitypulse-mlflow
    profiles: ["mlflow"]
    working_dir: /mlflow
    command: >-
      sh -c "pip install --no-cache-dir mlflow==2.18.0 psycopg[binary] &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlflow

volumes:
  postgres_data:
  mlruns:
